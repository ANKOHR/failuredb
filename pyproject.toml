[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failuredb"
version = "0.1.0"
description = "A deterministic, evidence-linked database for agent failure analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
failuredb = "failuredb.cli:main"

[tool.setuptools.packages.find]
include = ["failuredb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
